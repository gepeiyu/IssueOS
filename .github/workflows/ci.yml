name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (emit dist/ type declarations)
        run: for dir in packages/*/; do (cd "$dir" && npx tsc); done
      - name: Test
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm test
